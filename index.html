<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Marta LIVE</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#141338,#302366);color:#fff;font:17px system-ui,sans-serif;min-height:100vh}main{max-width:860px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:26px}h2{margin:0 0 16px}.card{background:#ffffff12;border:1px solid #ffffff35;border-radius:24px;padding:24px;margin:16px 0}button,input,textarea,select{font:inherit;border-radius:12px;padding:14px;border:0}input,textarea,select{width:100%;background:#fff;color:#17172a;margin:7px 0 15px}button{background:#8b75ff;color:white;font-weight:750;cursor:pointer;margin:6px 5px 6px 0}button:disabled{opacity:.45}.secondary{background:#ffffff25}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{min-height:105px;text-align:left;margin:0;font-size:18px}.answers button:nth-child(1){background:#e34450}.answers button:nth-child(2){background:#2476cf}.answers button:nth-child(3){background:#e3a625;color:#17172a}.answers button:nth-child(4){background:#248b67}.muted{color:#d4d0f0}.code{font-size:56px;letter-spacing:8px;font-weight:900;text-align:center}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff30;padding:12px 0}.hidden{display:none}.small{font-size:13px}#status{padding:12px;color:#ffdb83;min-height:36px}textarea{min-height:210px}label{font-weight:650}@media(max-width:520px){.answers{grid-template-columns:1fr}.answers button{min-height:80px}.code{font-size:40px}}</style></head><body><main><header><h1>🎓 QUIZ MARTA <span style="color:#a898ff">LIVE</span></h1><span>📱 + 🖥️</span></header><div id="status"></div><section id="home" class="card"><h2>Witaj w Quiz Marta</h2><p>Gra na żywo na telefonach i tablicy interaktywnej.</p><button onclick="show('teacher')">👩‍🏫 Nauczyciel</button><button class="secondary" onclick="show('join')">📱 Uczeń</button></section><section id="teacher" class="card hidden"><h2>Utwórz rozgrywkę</h2><div style="background:#ffffff19;border:1px solid #ffffff55;padding:16px;border-radius:16px;margin-bottom:18px"><h2>📂 Wczytaj gotowy test</h2><p>Wybierz plik .json lub .txt, który przygotuję dla Ciebie.</p><input id="quizFile" type="file" accept=".json,.txt,application/json,text/plain" onchange="importQuiz(event)"><button class="secondary" onclick="saveQuiz()">💾 Zapisz test na tym urządzeniu</button><label>Moje zapisane testy</label><select id="savedTests" onchange="loadSaved()"><option value="">— Wybierz zapisany test —</option></select><p id="importInfo" class="muted small"></p></div><label>Nazwa quizu</label><input id="title" value="Quiz Marta – przedsiębiorczość"><label>Pytania w formacie: pytanie | odpowiedź A | B | C | D | numer poprawnej (1–4)</label><textarea id="questions">Czym jest ryzyko w biznesie? | Gwarancją zysku | Możliwością wystąpienia niekorzystnego zdarzenia | Brakiem konkurencji | Zawsze stratą pieniędzy | 2
Co oznacza skrót BHP? | Bezpieczny handel produktami | Bezpieczeństwo i higiena pracy | Biuro handlu i płac | Bank handlowy Polski | 2
Co jest przychodem firmy? | Wpływ ze sprzedaży | Czynsz za lokal | Zakup towaru | Opłata za prąd | 1</textarea><p class="muted small">Każde pytanie w osobnym wierszu. Możesz dodać maksymalnie 40 pytań.</p><button onclick="createRoom()">Utwórz pokój i kod PIN</button><button class="secondary" onclick="show('home')">Wróć</button></section><section id="join" class="card hidden"><h2>Dołącz do gry</h2><label>6-cyfrowy kod PIN</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="123456"><label>Twój pseudonim</label><input id="nick" maxlength="24" placeholder="np. Ania"><button onclick="joinRoom()">Dołącz</button><button class="secondary" onclick="show('home')">Wróć</button></section><section id="game" class="card hidden"><div id="gameContent"></div></section></main><script>
// Wklej dane z Supabase: Project Settings → API. TYLKO anon/publishable key!
const SUPABASE_URL='WPISZ_TUTAJ_SUPABASE_URL';
const SUPABASE_KEY='WPISZ_TUTAJ_SUPABASE_ANON_KEY';
let role='',code='',token='',lastKey='',busy=false,interval=null; const STORAGE_KEY='quiz-marta-tests-v1';
const $=id=>document.getElementById(id);function show(id){for(const el of document.querySelectorAll('main>section'))el.classList.toggle('hidden',el.id!==id);$('status').textContent=''}
function status(s){$('status').textContent=s}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function rpc(fn,args){if(!SUPABASE_URL.startsWith('https://')||SUPABASE_KEY.startsWith('WPISZ'))throw Error('Najpierw skonfiguruj Supabase w pliku index.html');let res=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify(args)});let data=await res.json();if(!res.ok)throw Error(data.message||'Błąd połączenia');if(data?.error)throw Error(data.error);return data}
function parseLines(text){return text.trim().split(/\r?\n/).filter(Boolean).map((line,i)=>{let a=line.split('|').map(x=>x.trim());if(a.length!==6||!Number.isInteger(+a[5])||+a[5]<1||+a[5]>4||a.slice(0,5).some(x=>!x))throw Error('Niepoprawne pytanie nr '+(i+1));return {text:a[0],answers:a.slice(1,5),correct:+a[5]-1}})}
function validateQuiz(data){if(!data||typeof data.title!=='string'||!Array.isArray(data.questions)||data.questions.length<1||data.questions.length>40)throw Error('Plik musi zawierać tytuł i od 1 do 40 pytań');return {title:data.title,questions:data.questions.map((q,i)=>{if(typeof q.text!=='string'||!q.text.trim()||!Array.isArray(q.answers)||q.answers.length!==4||q.answers.some(a=>typeof a!=='string'||!a.trim())||!Number.isInteger(q.correct)||q.correct<0||q.correct>3)throw Error('Niepoprawne pytanie nr '+(i+1));return {text:q.text,answers:q.answers,correct:q.correct}})}}
function setQuiz(data){let q=validateQuiz(data);$('title').value=q.title;$('questions').value=q.questions.map(x=>[x.text,...x.answers,x.correct+1].join(' | ')).join('\n');$('importInfo').textContent='✅ Wczytano: '+q.title+' ('+q.questions.length+' pytań).'}
async function importQuiz(event){try{const file=event.target.files?.[0];if(!file)return;let text=await file.text();if(file.name.toLowerCase().endsWith('.json'))setQuiz(JSON.parse(text));else{let lines=text.trim().split(/\r?\n/);let title=lines[0].startsWith('#')?lines.shift().slice(1).trim():file.name.replace(/\.txt$/i,'');setQuiz({title,questions:parseLines(lines.join('\n'))})}status('')}catch(e){status('Nie udało się wczytać pliku: '+e.message)}finally{event.target.value=''}}
function getSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return {}}}
function updateSaved(){let sel=$('savedTests');if(!sel)return;sel.innerHTML='<option value="">— Wybierz zapisany test —</option>';Object.keys(getSaved()).sort().forEach(t=>{let opt=document.createElement('option');opt.value=t;opt.textContent=t;sel.appendChild(opt)})}
function saveQuiz(){try{let data=validateQuiz({title:$('title').value.trim(),questions:parseLines($('questions').value)});let saved=getSaved();saved[data.title]=data;localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));updateSaved();$('savedTests').value=data.title;$('importInfo').textContent='💾 Zapisano test na tym urządzeniu.';status('')}catch(e){status(e.message)}}
function loadSaved(){let t=$('savedTests').value;if(t){try{setQuiz(getSaved()[t]);status('')}catch(e){status(e.message)}}}
function newToken(){return crypto.randomUUID()}
updateSaved();
async function createRoom(){try{let qs=parseLines($('questions').value);if(qs.length<1||qs.length>40)throw Error('Dozwolone 1–40 pytań');token=newToken();code=String(Math.floor(100000+Math.random()*900000));await rpc('quiz_create',{p_code:code,p_host_token:token,p_title:$('title').value,p_questions:qs});role='host';start()}catch(e){status(e.message)}}
async function joinRoom(){try{code=$('pin').value.trim();if(!/^\d{6}$/.test(code))throw Error('Wpisz sześciocyfrowy kod');token=newToken();await rpc('quiz_join',{p_code:code,p_player_token:token,p_nickname:$('nick').value});role='player';start()}catch(e){status(e.message)}}
function start(){show('game');refresh();if(interval)clearInterval(interval);interval=setInterval(refresh,1200)}
async function hostAction(action){try{await rpc('quiz_host_action',{p_code:code,p_host_token:token,p_action:action});lastKey='';refresh()}catch(e){status(e.message)}}
async function answer(choice){if(busy)return;busy=true;try{await rpc('quiz_answer',{p_code:code,p_player_token:token,p_choice:choice});lastKey='';refresh()}catch(e){status(e.message)}finally{busy=false}}
function ranks(ps){return '<h3>🏆 Ranking</h3>'+ps.map((p,i)=>'<div class="rank"><span>'+(i+1)+'. '+escapeHtml(p.nickname)+'</span><b>'+p.score+' pkt</b></div>').join('')}
async function refresh(){try{let s=await rpc('quiz_state',{p_code:code,p_token:token});let key=JSON.stringify(s);if(key===lastKey)return;lastKey=key;let host=role==='host';let html='<p class="muted">'+escapeHtml(s.title)+'</p><div class="code">'+escapeHtml(code)+'</div>';
if(s.phase==='lobby'){html+='<h2>⏳ Poczekalnia</h2><p>Uczniowie otwierają tę samą stronę, wybierają „Uczeń” i wpisują kod.</p><p>Dołączyło: <b>'+s.players.length+'</b></p>'+ranks(s.players);if(host)html+='<button onclick="hostAction(\'next\')">▶ Rozpocznij grę</button>'}
if(s.phase==='question'){let q=s.question;html+='<p>Pytanie '+(s.current_index+1)+'/'+s.total+'</p><h2>'+escapeHtml(q.text)+'</h2><div class="answers">'+q.answers.map((a,i)=>'<button '+(!host&&s.answered?'disabled':'')+' onclick="'+(host?'void(0)':'answer('+i+')')+'">'+['▲','◆','●','■'][i]+' '+escapeHtml(a)+'</button>').join('')+'</div>';if(host)html+='<p>Po przeczytaniu pytania zakończ rundę.</p><button onclick="hostAction(\'results\')">Pokaż odpowiedź i ranking</button>';else if(s.answered)html+='<p>✅ Odpowiedź wysłana. Czekaj na wyniki.</p>'}
if(s.phase==='results'){let q=s.question;html+='<h2>✅ Poprawna odpowiedź</h2><p style="font-size:25px">'+escapeHtml(q.answers[q.correct])+'</p>'+ranks(s.players);if(host)html+='<button onclick="hostAction(\'next\')">'+(s.current_index+1>=s.total?'Zakończ quiz':'Następne pytanie →')+'</button>'}
if(s.phase==='finished'){html+='<h2>🎉 Koniec quizu!</h2>'+ranks(s.players)}
$('gameContent').innerHTML=html;status('')}catch(e){status(e.message)}}
</script></body></html>
